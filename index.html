/* ── Wischen ───────────────────────────────────────────────
   Die Seite folgt dem Finger, statt am Ende umzuspringen. Auslenkung
   mit Gummiband-Kennlinie (iOS-Prinzip): am Anfang 1:1, dann sättigend.
   Am Rand der Kette ist die Auslenkung klein — das sagt „hier ist Schluss",
   ohne dass etwas blockiert wirkt. */
const RMOT=matchMedia('(prefers-reduced-motion:reduce)');
const NOSWIPE='button,a,input,select,textarea,label,summary,p,td,cite,'+
  '.tick,.picks,.chips,.vfull,.pz,.legend,.ex-p,.ex-d,.hint';
const NOSWIPE_T='.tick,.picks,.chips,input[type=range],.vfull,textarea,.pz,.stepper';
function swView(){return document.getElementById('view')}
function swDamp(dx){
  const i=PAGES.indexOf(tab), W=innerWidth||360;
  const rand=(dx<0&&i>=PAGES.length-1)||(dx>0&&i<=0);
  const M=W*(rand?.06:.30);
  return Math.sign(dx)*M*(1-Math.exp(-Math.abs(dx)/M));
}
function swSet(dx){
  const v=swView(); if(!v)return;
  const p=Math.min(Math.abs(dx)/((innerWidth||360)*.3),1);
  v.style.transition='none'; v.style.willChange='transform,opacity';
  v.style.transform='translate3d('+swDamp(dx).toFixed(1)+'px,0,0)';
  v.style.opacity=(1-p*.28).toFixed(3);
  const d=document.querySelector('.pg-d'); if(d)d.style.opacity=(1-p*.5).toFixed(2);
  /* Ziel im Pager mitlaufen lassen — die Geste sagt dann selbst, wo sie hinführt. */
  document.body.dataset.sw=dx<0?'r':'l';
  document.body.style.setProperty('--swp',p.toFixed(2));
}
function swReset(weich){
  const v=swView(); if(!v)return;
  v.style.transition=weich?'transform 320ms var(--e-spring),opacity 200ms linear':'none';
  v.style.transform='translate3d(0,0,0)'; v.style.opacity='1';
  const d=document.querySelector('.pg-d'); if(d)d.style.opacity='';
  delete document.body.dataset.sw; document.body.style.removeProperty('--swp');
  clearTimeout(swReset._t);
  swReset._t=setTimeout(()=>{if(v.style.transform==='translate3d(0px, 0px, 0px)'||
    v.style.transform==='translate3d(0,0,0)')v.removeAttribute('style')},weich?340:0);
}
function swGo(dir){
  const i=PAGES.indexOf(tab), j=i+dir;
  if(i<0||j<0||j>=PAGES.length)return swReset(true);
  const v=swView();
  const ab=()=>{tab=PAGES[j]; if(v)v.removeAttribute('style');
    delete document.body.dataset.sw; document.body.style.removeProperty('--swp');
    const d=document.querySelector('.pg-d'); if(d)d.style.opacity='';
    render(); scrollTo(0,0)};
  if(RMOT.matches||!v)return ab();
  const w=Math.min((innerWidth||360)*.28,150);
  v.style.transition='transform 160ms var(--e-acc),opacity 140ms linear';
  v.style.transform='translate3d('+(-dir*w).toFixed(0)+'px,0,0)';
  v.style.opacity='0';
  clearTimeout(swGo._t); swGo._t=setTimeout(ab,155);
}
function swEnd(dx,dt){
  const W=innerWidth||360, i=PAGES.indexOf(tab);
  if(i<0)return swReset(true);
  /* Zwei Wege: weit genug gezogen, oder kurz und schnell geschnippt.
     Der Schnipp braucht eine plausible Dauer — sonst löst jede
     synthetische Null-Millisekunden-Geste einen Wechsel aus. */
  const v=Math.abs(dx)/Math.max(dt,1);
  const noetig=Math.min(W*.22,110);
  const zug=Math.abs(dx)>noetig||(dt>40&&v>.45&&Math.abs(dx)>55);
  const dir=dx<0?1:-1;
  if(zug&&PAGES[i+dir]!==undefined)swGo(dir); else swReset(true);
}
function swAus(){return PAGES.indexOf(tab)<0||!!document.querySelector('.vfull')}

let SW=null;
document.addEventListener('touchstart',e=>{
  SW=null;
  if(swAus()||e.touches.length>1)return;
  const t=e.target; if(t&&t.closest&&t.closest(NOSWIPE_T))return;
  SW={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),lock:0,dx:0};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW||e.touches.length>1)return;
  const t=e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(!SW.lock){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(Math.abs(dx)<=Math.abs(dy)*1.2){SW=null;return}
    SW.lock=1;
  }
  e.preventDefault();
  SW.dx=dx; swSet(dx);
},{passive:false});
document.addEventListener('touchend',()=>{
  const s=SW; SW=null; if(s&&s.lock)swEnd(s.dx,Date.now()-s.t);
},{passive:true});
document.addEventListener('touchcancel',()=>{const s=SW;SW=null;if(s&&s.lock)swReset(true)},{passive:true});

/* Dasselbe mit der Maus: gedrückt ziehen. Textblöcke bleiben markierbar. */
let MD=null, SWALLOW=false;
document.addEventListener('mousedown',e=>{
  MD=null;
  if(e.button!==0||swAus())return;
  const t=e.target; if(t&&t.closest&&t.closest(NOSWIPE))return;
  MD={x:e.clientX,y:e.clientY,t:Date.now(),lock:0,dx:0};
},true);
document.addEventListener('mousemove',e=>{
  if(!MD)return;
  const dx=e.clientX-MD.x, dy=e.clientY-MD.y;
  if(!MD.lock){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    if(Math.abs(dx)<=Math.abs(dy)*1.2){MD=null;return}
    MD.lock=1; try{getSelection().removeAllRanges()}catch(_){}
    document.body.classList.add('ziehen');
  }
  MD.dx=dx; swSet(dx);
},true);
document.addEventListener('mouseup',e=>{
  const m=MD; MD=null;
  document.body.classList.remove('ziehen');
  if(!m||!m.lock)return;
  SWALLOW=true; swEnd(m.dx,Date.now()-m.t);
},true);
/* Nach einem Zug darf der abschließende Klick nichts mehr auslösen. */
document.addEventListener('click',e=>{
  if(!SWALLOW)return; SWALLOW=false; e.stopPropagation(); e.preventDefault();
},true);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const i=PAGES.indexOf(tab); if(i<0||document.querySelector('.vfull'))return;
  const dir=e.key==='ArrowRight'?1:-1;
  if(PAGES[i+dir]!==undefined){e.preventDefault();swGo(dir)}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const g=e.target.closest&&e.target.closest('g.pz');
  if(!g)return; e.preventDefault(); FOCUS=g.dataset.v; A.zone(g.dataset.v);
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-f]');
  if(t&&F[t.dataset.f])F[t.dataset.f](t.value,t)});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-i]'); if(!t)return;
  const k=t.dataset.i;
  if(k==='vseek'){const v=el('vvid');
    if(v&&v.duration)v.currentTime=(+t.value/1000)*v.duration; return}
  if(k==='rpe'){D.rpe=+t.value;el('rpeV').textContent=D.rpe;el('loadV').textContent=sLoad(D)}
  else if(k.startsWith('w_')){const f=k.slice(2);well()[f]=+t.value;
    el('wv_'+f).textContent=t.value;save()}
});
/* Tastatur: zählen ohne hinzusehen */
/* Die Kürzel dürfen nur greifen, wenn der Fokus nirgends sonst liegt —
   sonst kapert die Leertaste jede fokussierte Schaltfläche. */
document.addEventListener('keydown',e=>{
  if(tab!=='log'||D.type!=='wurf'||e.metaKey||e.ctrlKey||e.altKey)return;
  const a=document.activeElement;
  const frei=!a||a===document.body||a.dataset&&a.dataset.a==='shot';
  if(!frei)return;
  let v=null;
  if(e.code==='Space'||e.key==='+')v='1';
  else if(e.key==='ArrowDown'||e.key==='-')v='0';
  else if(e.key==='Backspace'){e.preventDefault();return A.undoShot()}
  if(v===null)return;
  e.preventDefault();
  const b=document.querySelector(`[data-a="shot"][data-v="${v}"]`); if(b)A.shot(v,b);
});

/* Die Uhr bleibt erreichbar, egal wo man ist — unten schwebend, schmal,
   und nur wenn ein Training läuft. Body bekommt dann unten Platz, damit
   nichts verdeckt wird. */
function renderLive(){
  const n=el('live'); if(!n)return;
  document.body.classList.toggle('has-live',T.on);
  if(!T.on){n.innerHTML='';return}
  n.innerHTML=`<div class="live-bar">
    <button class="live-go" data-a="goLog" aria-label="Zur Erfassung">
      <span class="dot-live"></span><span class="clock num" id="tclock2">${tFmt(tElapsed())}</span>
      <span class="live-s">${TN(D.type).n}</span></button>
    <button class="btn btn--auto" data-a="tStop">Beenden</button></div>`;
}
function saveDraft(){
  try{const empty=!D.lifts.length&&!D.shots.length&&!D.drills.length&&!D.notes&&!S.events.length;
    if(empty)return localStorage.removeItem(DKEY);
    localStorage.setItem(DKEY,JSON.stringify({t:Date.now(),D,S,KX,DX}));}catch(e){}
}
function loadDraft(){
  try{const r=localStorage.getItem(DKEY); if(!r)return;
    const o=JSON.parse(r);
    if(!o||!o.D||Date.now()-o.t>36e5*20)return localStorage.removeItem(DKEY);
    D=Object.assign(D,o.D); S=Object.assign(S,o.S||{}); KX=Object.assign(KX,o.KX||{});
    DX=Object.assign(DX,o.DX||{});
    setTimeout(()=>toast('Angefangene Einheit wiederhergestellt'),400);
  }catch(e){}
}
/* Kein Menü mehr — stattdessen zeigt der Pager dauerhaft, was links und
   rechts liegt, und ist gleichzeitig anklickbar. */
const LBL=Object.fromEntries(TABS);
function pager(){
  const i=PAGES.indexOf(tab);
  if(i<0)return `<div class="pg pg--sub">
    <button class="pg-b" data-a="go" data-v="home" aria-label="Zurück zum Start">‹ Start</button>
    <div class="pg-c">${LBL[tab]||''}</div><div class="pg-b" aria-hidden="true"></div></div>`;
  const L=PAGES[i-1], R=PAGES[i+1];
  return `<div class="pg">
    ${L?`<button class="pg-b" data-a="go" data-v="${L}"><span>‹</span>${LBL[L]}</button>`
       :'<div class="pg-b"></div>'}
    <div class="pg-c">${LBL[tab]}<div class="pg-d">${PAGES.map(p=>
      `<i class="${p===tab?'on':''}"></i>`).join('')}</div></div>
    ${R?`<button class="pg-b pg-r" data-a="go" data-v="${R}">${LBL[R]}<span>›</span></button>`
       :'<div class="pg-b"></div>'}
  </div>`;
}
let LASTI=1;
/* Zeigt an den Rändern einer Scroll-Leiste, dass es dort weitergeht. */
function kanten(n){
  if(!n)return;
  const f=()=>{const m=n.scrollWidth-n.clientWidth;
    n.classList.toggle('sc-l',m>4&&n.scrollLeft>3);
    n.classList.toggle('sc-r',m>4&&n.scrollLeft<m-3)};
  if(!n._kanten){n._kanten=1;n.addEventListener('scroll',f,{passive:true});
    addEventListener('resize',f,{passive:true})}
  f();
}
function render(focusId){
  el('rail-nav').innerHTML=TABS.map(([k,n])=>
    `<button data-a="go" data-v="${k}" ${k===tab?'aria-current="page"':''}>${n}</button>`).join('');
  el('pager').innerHTML=pager();
  const w=loadRange(7,0), c=inRange(7,0).length;
  const gs=goalState();
  el('railFoot').innerHTML=`<div class="rf-v num">${nf(w)}</div>
    <div class="rf-k">AU diese Woche · ${c} ${c===1?'Einheit':'Einheiten'}</div>
    <div class="rf-g">${gs.slice(0,2).map(g=>{
      const p=Math.min(100,g.t?g.v/g.t*100:0);
      return `<div class="rf-b"><div class="rf-bn">${g.n}<span>${g.fmt(g.v)}${g.u} / ${g.fmt(g.t)}${g.u}</span></div>
        <div class="rf-t"><i style="width:${p}%;background:${p>=100?'var(--hit-hi)':'var(--acc)'}"></i></div></div>`}).join('')}</div>`;
  el('view').innerHTML=tab==='home'?viewHome():tab==='log'?viewLog():tab==='hist'?viewHist()
    :tab==='ana'?viewAna():tab==='reha'?viewRehab():viewData();
  document.body.dataset.area=tab;
  /* Richtung der Bewegung macht den Wechsel begreifbar. */
  const ni=PAGES.indexOf(tab);
  if(ni>=0&&LASTI>=0&&ni!==LASTI){const v=el('view');
    v.classList.remove('sl','sr'); void v.offsetWidth;
    v.classList.add(ni>LASTI?'sl':'sr');}
  if(ni>=0)LASTI=ni;
  /* Ein Bereich, ein Farbton: im Wurftraining ist alles Bedienbare grün,
     im Krafttraining orange. Kein Nebeneinander von Koralle und Grün. */
  const AC={home:'#e84c62',hist:'#e84c62',data:'#e84c62',reha:'#e84c62',ana:'#7b78e6'};
  const area=tab==='log'?TN(D.type).c:(AC[tab]||'#e84c62');
  document.documentElement.style.setProperty('--area',area);
  document.documentElement.style.setProperty('--area-soft',area+'26');
  /* Heute ans rechte Ende scrollen und die Ausblend-Kanten setzen —
     erst nach dem Layout, sonst ist scrollWidth noch 0. */
  const t=el('tick');
  if(t)requestAnimationFrame(()=>{const d=t.querySelector('[data-today]');
    if(!d||d===t.lastElementChild)t.scrollLeft=t.scrollWidth;
    else{const dr=d.getBoundingClientRect(), tr=t.getBoundingClientRect();
      t.scrollLeft+=dr.right-tr.right+22}
    kanten(t)});
  document.querySelectorAll('.picks').forEach(n=>requestAnimationFrame(()=>kanten(n)));
  saveDraft();
  renderLive();
  if(tab==='log'&&D.type==='wurf'){const vv=el('vvid');
    if(vv&&V.file){if(vv.src!==V.file)vv.src=V.file; vidBind();
      setTimeout(()=>{vidDraw();vidZoom()},80)}}
  const fid=focusId||FOCUS; FOCUS=null;
  if(fid){const n=el(fid)||document.querySelector(`[data-a="${fid}"],[data-v="${fid}"]`);
    if(n&&n.focus)try{n.focus({preventScroll:true})}catch(e){n.focus()}}
}
let FOCUS=null;
loadDraft();
render();
</script>
</body>
